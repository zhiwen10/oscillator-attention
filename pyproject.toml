[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oscattn"
version = "0.1.0"
description = "Attention read out from the phases of coupled oscillators (dynamics from Un-0)"
requires-python = ">=3.11"
dependencies = ["torch>=2.11", "numpy", "matplotlib", "un0"]

[tool.setuptools]
packages = ["oscattn"]
